server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/game_memories
    username: postgres
    password: fabio666
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  base-url: http://localhost:8080
  storage:
    path: storage

springdoc:
  swagger-ui:
    path: /docs
    enabled: true
